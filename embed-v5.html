<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>格致數位閱讀館｜選擇刊物與單本嵌入 V4</title>
<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.min.js" defer></script>
<style>
:root{--bg:#142333;--panel:#1d3245;--gold:#e4c18b;--line:#ffffff25;--fg:#ffffff;--muted:#c4d1d9;--bar:#101e2c;--stage1:#586773;--stage2:#223343;--stage3:#101d29;--btn:#ffffff13;--btn-border:#ffffff44;--btn-hover:#ffffff2d;--field:#0d1a27;--field-border:#647585;--status:#152638f2}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.6 system-ui,-apple-system,'Noto Sans TC',sans-serif}
button,input{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}
a{color:var(--gold)}.app{min-height:100dvh;display:flex;flex-direction:column}
.toolbar{z-index:4;display:flex;gap:12px;align-items:center;justify-content:space-between;background:var(--bar);padding:10px 15px;border-bottom:1px solid var(--line)}
.booktitle{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.sub{color:var(--muted);font-size:11px}
.btns,.nav{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
button{color:var(--fg);background:var(--btn);border:1px solid var(--btn-border);padding:7px 12px;border-radius:7px}
button:hover:not(:disabled){background:var(--btn-hover)}.stage{position:relative;flex:1;min-height:380px;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:22px 12px;background:radial-gradient(ellipse at 50% 50%,var(--stage1) 0,var(--stage2) 55%,var(--stage3) 100%)}
#book{margin:0 auto}.page{background:white;overflow:hidden}.page img{display:block;width:100%;height:100%;object-fit:contain;background:white;user-select:none;-webkit-user-drag:none}
.status{position:absolute;inset:0;z-index:2;display:grid;place-items:center;text-align:center;padding:25px;background:var(--status)}
.status[hidden]{display:none}.statuscard{max-width:490px}.status h2{font-size:19px}.status p{color:var(--muted);white-space:pre-line}
.spinner{width:38px;height:38px;border-radius:50%;border:3px solid #ffffff30;border-top-color:var(--gold);animation:spin .9s linear infinite;margin:0 auto 12px}
@keyframes spin{to{transform:rotate(360deg)}}.nav{background:var(--bar);padding:10px;border-top:1px solid var(--line)}#counter{min-width:108px;text-align:center;font-size:12px}
small.note{display:block;text-align:center;color:var(--muted);font-size:11px;padding:0 12px 8px;background:var(--bar)}
.catalog{width:min(810px,calc(100% - 30px));margin:25px auto}.catalog h1{font-size:24px;margin-bottom:4px}.catalog p{color:var(--muted)}.entry{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:10px 0;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px}
.entry strong{display:block}.entry small{color:var(--muted)}.entry .actions{display:flex;gap:7px;flex-wrap:wrap}.entry button{white-space:nowrap}
.catalog-message{padding:20px;border-radius:12px;background:var(--panel);white-space:pre-line}.codebox{margin-top:16px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:15px}.codebox code{display:block;overflow-wrap:anywhere;color:var(--gold);margin:8px 0}.codebox textarea{width:100%;min-height:122px;resize:vertical;border:1px solid var(--field-border);border-radius:8px;background:var(--field);color:var(--fg);padding:10px;font:12px/1.7 monospace}
.document{flex:1;display:flex;flex-direction:column;min-height:360px}.document iframe{flex:1;width:100%;border:0;background:white}.docHint{padding:7px 15px;background:var(--panel);color:var(--muted);font-size:12px}
@media(max-width:600px){.toolbar{padding:8px;gap:6px}.booktitle{max-width:52vw;font-size:12px}.sub{font-size:10px}.toolbar button,.nav button{padding:6px 8px;font-size:12px}.stage{min-height:300px;padding:8px 3px}.entry{align-items:start;flex-direction:column}.catalog h1{font-size:20px}}
/* V4：選色工具列只顯示於選書設定頁，不進入嵌入閱讀畫面 */
.themePicker{margin:20px 0 16px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:15px}
.themePicker h2{font-size:15px;margin:0 0 4px}.themePicker p{margin:0 0 12px;font-size:12px}
.themeOptions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.themePreset{min-width:84px;display:flex;gap:7px;align-items:center;justify-content:center}
.themeSwatch{width:17px;height:17px;border-radius:50%;display:inline-block;border:1px solid #8888}
.themePreset[aria-pressed="true"]{outline:2px solid var(--gold);outline-offset:2px}
.themeCustom{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:5px 9px;font-size:12px}
.themeCustom input{width:38px;height:29px;padding:0;border:0;background:transparent;cursor:pointer}
.themePreview{margin-top:12px;font-size:12px;color:var(--muted)}
@media(max-width:600px){.themePreset{min-width:76px}.themePicker{padding:12px}}
</style>
</head>
<body><div class="app" id="app">
<header class="toolbar" id="toolbar"><div style="min-width:0"><div class="booktitle" id="title">格致數位閱讀館</div><div class="sub" id="subtitle">GER-JYH DIGITAL LIBRARY</div></div><div class="btns"><button type="button" id="openNew" title="於新分頁開啟閱讀器">↗ 新視窗</button><button type="button" id="fullscreen">⛶ 全螢幕</button></div></header>
<main class="stage" id="stage"><div id="book"></div><div class="status" id="status"><div class="statuscard"><div class="spinner" id="spinner"></div><h2 id="statusTitle">正在載入刊物</h2><p id="statusText">請稍候…</p><button id="retry" hidden>重新載入</button></div></div></main>
<div class="nav" id="nav"><button type="button" id="prev">← 上一頁</button><span id="counter">準備中</span><button type="button" id="next">下一頁 →</button></div><small class="note" id="note">拖曳紙張角落可翻頁，手機可直接左右翻閱。</small>
</div>
<script>
'use strict';
// 以使用者目前運作正常的個人 Gmail 公開閱讀 API 為來源；不接觸管理後台。
const PUBLIC_API_URL='https://script.google.com/macros/s/AKfycbyRvmNJLY97V5fpVwqJnJFNiE5by1NXze6U0PDiawWpD3lWQr1Rp4TuZWC2kVuCS84/exec';
const $=id=>document.getElementById(id);const params=new URLSearchParams(location.search);
const selectedId=params.get('id')||'';
const selectedShareId=params.get('select')||''; // 從閱讀館的嵌入分享按鈕指定刊物
let flip=null,images=[],currentPage=0,rawItem=null;
// V4 色彩設定：固定預設主題，或安全的 #RRGGBB 自訂背景色。
const THEMES={dark:'#142333',light:'#f5f3ed',blue:'#dfeef5',warm:'#fff2e4',green:'#e7f1e9'};
function normalizedHex(value){const t=String(value||'').trim();return /^#[0-9a-fA-F]{6}$/.test(t)?t.toLowerCase():null}
function currentTheme(){return normalizedHex(params.get('color')) || THEMES[params.get('theme')] || THEMES.dark}
let themeColor=currentTheme();
function rgb(hex){return [1,3,5].map(i=>parseInt(hex.slice(i,i+2),16))}
function mix(a,b,t){const A=rgb(a),B=rgb(b);return '#'+A.map((v,i)=>Math.round(v*(1-t)+B[i]*t).toString(16).padStart(2,'0')).join('')}
function brightness(hex){const [r,g,b]=rgb(hex).map(x=>x/255).map(x=>x<=.04045?x/12.92:((x+.055)/1.055)**2.4);return .2126*r+.7152*g+.0722*b}
function applyTheme(hex){const h=normalizedHex(hex)||THEMES.dark;themeColor=h;
 const dark=brightness(h)<.26,fg=dark?'#ffffff':'#203145',muted=dark?'#c4d1d9':'#566775';
 const root=document.documentElement.style;
 const vars={ '--bg':h,'--panel':mix(h,dark?'#ffffff':'#000000',dark?.10:.035), '--gold':dark?'#e4c18b':'#805d2f',
 '--line':dark?'#ffffff36':'#00000024','--fg':fg,'--muted':muted,'--bar':mix(h,dark?'#000000':'#ffffff',dark?.18:.24),
 '--stage1':mix(h,dark?'#ffffff':'#ffffff',dark?.28:.35), '--stage2':mix(h,dark?'#ffffff':'#000000',dark?.08:.04), '--stage3':mix(h,dark?'#000000':'#000000',dark?.12:.08),
 '--btn':dark?'#ffffff18':'#0000000b','--btn-border':dark?'#ffffff55':'#00000030','--btn-hover':dark?'#ffffff2d':'#0000001b',
 '--field':dark?mix(h,'#000000',.23):'#ffffff','--field-border':dark?'#ffffff66':'#00000048','--status':dark?'#152638f2':'#f8f6f1f4'};
 for(const [name,value] of Object.entries(vars))root.setProperty(name,value);
 const custom=document.getElementById('themeColor');if(custom)custom.value=h;
 document.querySelectorAll('.themePreset').forEach(b=>b.setAttribute('aria-pressed',String(THEMES[b.dataset.theme]===h)));
 const preview=document.getElementById('themePreview');if(preview)preview.textContent='目前背景：'+h.toUpperCase()+' ｜ 此設定會帶入複製的閱讀網址與 HTML';
 const catalogStage=document.getElementById('stage');if(catalogStage && !selectedId)catalogStage.style.background='var(--bg)';
}
function safeHttps(value){try{const u=new URL(String(value||''));return u.protocol==='https:'?u.href:''}catch(_){return ''}}
function jsonp(query,timeout=30000){return new Promise((resolve,reject)=>{
 const callback='gjEmbed_'+Date.now()+'_'+Math.random().toString(36).slice(2,8);
 const script=document.createElement('script');let settled=false;
 const cleanup=()=>{clearTimeout(timer);script.remove();try{delete window[callback]}catch(_){window[callback]=undefined}};
 const finish=(error,value)=>{if(settled)return;settled=true;cleanup();error?reject(error):resolve(value)};
 const timer=setTimeout(()=>finish(Error('API 等候逾時。若一般模式失敗，可先用無痕視窗測試。')),timeout);
 window[callback]=v=>finish(null,v);script.onerror=()=>finish(Error('API 無法載入：可能受到 Google 登入狀態或瀏覽器限制影響。'));
 script.src=PUBLIC_API_URL+'?'+new URLSearchParams({...query,callback}).toString();document.head.appendChild(script);
})}
function state(title,detail,error=false){$('status').hidden=false;$('statusTitle').textContent=title;$('statusText').textContent=detail||'';$('spinner').hidden=error;$('retry').hidden=!error}
function hideState(){$('status').hidden=true}
function issue(v){const m=String(v||'').match(/^(\d{4})-(\d{2})/);return m?m[1]+'.'+m[2]:(v||'')}
function getEmbedUrl(id){const u=new URL('embed-v5.html',location.href);u.search='';u.hash='';u.searchParams.set('id',id);u.searchParams.set('color',themeColor);return u.href}
function getEmbedHtml(id){const u=getEmbedUrl(id).replace(/&/g,'&amp;').replace(/"/g,'&quot;');return '<div style="width:100%;max-width:900px;margin:0 auto;">\n  <iframe src="'+u+'" title="格致數位閱讀館－電子刊物" style="display:block;width:100%;height:clamp(480px,64vw,580px);border:0;border-radius:10px;background:'+themeColor+';" allow="fullscreen" allowfullscreen loading="lazy"></iframe>\n</div>'}
async function copy(value){try{await navigator.clipboard.writeText(value);alert('已複製到剪貼簿')}catch(e){const field=$('embedCode');if(field){field.focus();field.select()}else prompt('請複製以下文字：',value)}}
function makeButton(label,click){const b=document.createElement('button');b.type='button';b.textContent=label;b.addEventListener('click',click);return b}
function catalog(items){document.title='選擇單本刊物｜格致數位閱讀館';$('toolbar').hidden=true;$('nav').hidden=true;$('note').hidden=true;
 $('stage').style.cssText='display:block;overflow:auto;padding:1px 0;background:var(--bg)';$('stage').replaceChildren();
 const wrap=document.createElement('div');wrap.className='catalog';const h=document.createElement('h1');h.textContent='單本刊物嵌入｜色彩設定 V4';wrap.appendChild(h);
 const p=document.createElement('p');p.textContent='請先選擇一本已發布刊物，測試獨立閱讀頁，並複製校網 HTML 嵌入碼。此頁不會更動原本的書櫃。';wrap.appendChild(p);
 if(selectedShareId){
   const chosen=items.find(x=>String(x.id)===selectedShareId);
   const hint=document.createElement('p');hint.textContent=chosen?'正在設定：'+(chosen.title||'未命名刊物'):'找不到指定刊物，請確認已發布狀態，或返回全部刊物清單';wrap.appendChild(hint);
   const back=document.createElement('a');back.href='embed-v5.html';back.textContent='← 顯示全部刊物';back.style.cssText='display:inline-block;margin:0 0 18px;color:var(--text);font-weight:700';wrap.appendChild(back);
 }
 const picker=document.createElement('section');picker.className='themePicker';picker.innerHTML='<h2>閱讀器背景色彩</h2><p>選擇適合校網版型的顏色；複製 HTML 時會一併保留設定。</p>';
 const opts=document.createElement('div');opts.className='themeOptions';
 for(const [name,label] of [['dark','深色'],['light','淺色'],['blue','淡藍'],['warm','暖米'],['green','淡綠']]){
   const b=makeButton('',()=>applyTheme(THEMES[name]));b.className='themePreset';b.dataset.theme=name;b.setAttribute('aria-pressed',String(themeColor===THEMES[name]));
   const s=document.createElement('span');s.className='themeSwatch';s.style.background=THEMES[name];b.append(s,document.createTextNode(label));opts.appendChild(b);
 }
 const custom=document.createElement('label');custom.className='themeCustom';custom.textContent='自訂顏色';
 const color=document.createElement('input');color.type='color';color.id='themeColor';color.value=themeColor;color.title='選擇閱讀器背景顏色';color.addEventListener('input',e=>applyTheme(e.target.value));custom.appendChild(color);opts.appendChild(custom);
 picker.appendChild(opts);const preview=document.createElement('div');preview.id='themePreview';preview.className='themePreview';picker.appendChild(preview);wrap.appendChild(picker);applyTheme(themeColor);
 if(!items.length){const msg=document.createElement('div');msg.className='catalog-message';msg.textContent='公開 API 未回傳已發布刊物。請先檢查 API 的部署與發布狀態。';wrap.appendChild(msg)}
 for(const item of items.filter(x=>!selectedShareId||String(x.id)===selectedShareId)){const line=document.createElement('div');line.className='entry';const info=document.createElement('div');const name=document.createElement('strong');name.textContent=item.title||'未命名刊物';info.appendChild(name);const meta=document.createElement('small');meta.textContent=(item.category||'刊物')+' · '+(item.mode==='document'?'PDF 文件':item.mode==='link'?'外部連結':'翻頁書');info.appendChild(meta);line.appendChild(info);
 const acts=document.createElement('div');acts.className='actions';acts.appendChild(makeButton('預覽這本',()=>location.href=getEmbedUrl(item.id)));
 if(item.mode!=='link'){acts.appendChild(makeButton('複製網址',()=>copy(getEmbedUrl(item.id))));acts.appendChild(makeButton('複製 HTML',()=>{const html=getEmbedHtml(item.id);$('embedCode').value=html;copy(html)}))}
 line.appendChild(acts);wrap.appendChild(line)}
 const box=document.createElement('div');box.className='codebox';const label=document.createElement('div');label.textContent='校網 HTML 嵌入碼（預設最大寬度 900px）';box.appendChild(label);const ta=document.createElement('textarea');ta.id='embedCode';ta.readOnly=true;ta.placeholder='點選上方某本刊物的「複製 HTML」，嵌入碼會顯示在這裡。';box.appendChild(ta);wrap.appendChild(box);$('stage').appendChild(wrap);applyTheme(themeColor);
}
function update(){if(!flip)return;const index=flip.getCurrentPageIndex();currentPage=index;$('counter').textContent='第 '+(index+1)+' / '+images.length+' 頁';$('prev').disabled=index===0;$('next').disabled=index>=images.length-1}
function dimensions(aspect){const stage=$('stage');const availableW=Math.max(230,stage.clientWidth-14),availableH=Math.max(210,stage.clientHeight-20);
 const portrait=availableW<720;let w=Math.min(560,availableW*(portrait?.88:.45));let h=w*aspect;
 if(h>availableH*.93){h=availableH*.93;w=h/aspect}
 w=Math.max(80,Math.floor(w));h=Math.max(70,Math.floor(w*aspect));return{width:w,height:h,minWidth:Math.max(70,Math.floor(w*.55)),minHeight:Math.max(50,Math.floor(h*.55))}}
function mountPages(srcs){if(!window.St?.PageFlip)throw Error('翻頁引擎載入失敗，請確認網路允許載入 jsDelivr。');
 if(flip){try{flip.destroy()}catch(_){}}$('book').replaceChildren();images=srcs;srcs.forEach((src,i)=>{const div=document.createElement('div');div.className='page';const img=document.createElement('img');img.src=src;img.alt='第 '+(i+1)+' 頁';div.appendChild(img);$('book').appendChild(div)});
 const img=$('book').querySelector('img');const ratio=img.naturalHeight/img.naturalWidth;const d=dimensions(ratio);
 flip=new St.PageFlip($('book'),{width:d.width,height:d.height,minWidth:d.minWidth,maxWidth:d.width,minHeight:d.minHeight,maxHeight:d.height,size:'stretch',showCover:true,usePortrait:true,drawShadow:true,flippingTime:850,mobileScrollSupport:false,showPageCorners:true});
 flip.loadFromHTML(document.querySelectorAll('#book .page'));flip.on('flip',update);update();}
async function loadFlip(item){const n=Number(item.pageCount);if(!Number.isInteger(n)||n<1||n>30)throw Error('此刊物頁數資訊不符合翻頁模式（預期為 1～30 頁）。');
 const srcs=new Array(n);let cursor=0,finished=0;
 await Promise.all(Array.from({length:Math.min(3,n)},async()=>{while(cursor<n){const index=cursor++;const response=await jsonp({action:'page',id:String(item.id),page:String(index)},45000);if(!response?.ok||!response.base64)throw Error(response?.error||('第 '+(index+1)+' 頁無法讀取'));
 srcs[index]='data:image/jpeg;base64,'+response.base64;finished++;state('正在準備翻頁書','已下載 '+finished+' / '+n+' 頁…')}}));
 state('正在建立閱讀器','頁面載入完成，請稍候…');await Promise.all(srcs.map((src,i)=>new Promise((resolve,reject)=>{const im=new Image();im.onload=resolve;im.onerror=()=>reject(Error('第 '+(i+1)+' 頁圖片解析失敗'));im.src=src})));
 mountPages(srcs);hideState();}
function loadDocument(item){const url=safeHttps(item.url);if(!url)throw Error('這本刊物沒有有效的 PDF 閱讀網址');
 $('stage').className='document';$('stage').replaceChildren();const hint=document.createElement('div');hint.className='docHint';hint.textContent='大型 PDF 以原始文件方式閱讀。若瀏覽器無法內嵌顯示，請選擇「新視窗」。';const frame=document.createElement('iframe');frame.src=url;frame.title=item.title||'PDF 閱讀器';frame.referrerPolicy='no-referrer';$('stage').append(hint,frame);$('nav').hidden=true;$('note').hidden=true;$('openNew').onclick=()=>window.open(url,'_blank','noopener,noreferrer');}
async function begin(){try{const result=await jsonp({api:'public'});if(!result?.ok||!Array.isArray(result.items))throw Error(result?.error||'API 未回傳正確刊物清單');const items=result.items.filter(i=>i&&i.id&&i.status!=='draft');
 if(!selectedId){catalog(items);return}
 const item=items.find(i=>String(i.id)===selectedId);if(!item)throw Error('找不到這本刊物，請確認刊物 ID 與「已發布」狀態。');rawItem=item;
 $('title').textContent=item.title||'電子刊物';$('subtitle').textContent=(item.category||'格致數位閱讀館')+(item.issue?' · '+issue(item.issue):'');document.title=(item.title||'刊物')+'｜格致數位閱讀館';$('openNew').onclick=()=>window.open(location.href,'_blank','noopener,noreferrer');
 if(item.mode==='link')throw Error('這本是外部連結刊物，無法使用翻頁嵌入。');
 if(item.mode==='document'){loadDocument(item);hideState();return}
 await loadFlip(item)
 }catch(e){console.error('嵌入閱讀器載入失敗',e);state('刊物暫時無法開啟',e.message||String(e),true)}}
$('retry').onclick=()=>location.reload();$('prev').onclick=()=>flip?.flipPrev('bottom');$('next').onclick=()=>flip?.flipNext('bottom');$('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await $('app').requestFullscreen()}catch(e){alert('瀏覽器未允許全螢幕，仍可使用嵌入閱讀模式。')}};
document.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')flip?.flipPrev();if(e.key==='ArrowRight')flip?.flipNext()});window.addEventListener('resize',()=>{try{flip?.update()}catch(_){}});
applyTheme(themeColor);begin();
</script></body></html>

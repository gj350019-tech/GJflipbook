<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>格致青年｜2026年4月 翻頁電子書</title><style>
*{box-sizing:border-box}body{margin:0;background:#1d2733;color:#f5f2eb;font-family:system-ui,"Noto Sans TC",sans-serif}header{text-align:center;padding:22px 12px 6px}header small{letter-spacing:.22em;color:#d6b88b}h1{font-size:clamp(22px,3vw,34px);margin:6px}.sub{color:#b7bec8;font-size:13px}.stage{display:flex;justify-content:center;align-items:center;perspective:1600px;padding:20px 10px;min-height:58vh}.book{width:min(94vw,1050px);aspect-ratio:1.32;position:relative;display:flex;filter:drop-shadow(0 18px 24px #0007)}.sheet{width:50%;height:100%;background:#fff;position:relative;overflow:hidden}.sheet img{width:100%;height:100%;object-fit:fill}.left{box-shadow:inset -10px 0 15px #0002}.right{box-shadow:inset 10px 0 15px #0002}.book:after{content:"";position:absolute;left:49.65%;height:100%;width:.7%;background:linear-gradient(90deg,#0003,#fff3,#0003);pointer-events:none}.turn{position:absolute;z-index:5;top:0;left:50%;width:50%;height:100%;transform-origin:left center;transform-style:preserve-3d;pointer-events:none;transition:transform .72s cubic-bezier(.3,.15,.2,1)}.turn.go{transform:rotateY(-180deg)}.face{position:absolute;inset:0;backface-visibility:hidden;background:white;box-shadow:0 3px 18px #0004}.face img{width:100%;height:100%}.back{transform:rotateY(180deg)}.controls{display:flex;align-items:center;justify-content:center;gap:14px;padding:8px 12px 18px;flex-wrap:wrap}button,a.btn{border:1px solid #c5aa80;background:#d5b98d;color:#1b2734;border-radius:30px;padding:10px 18px;font:inherit;cursor:pointer;text-decoration:none}button:disabled{opacity:.35;cursor:default}.count{min-width:85px;text-align:center}.hint{text-align:center;color:#aeb7c2;font-size:12px;padding-bottom:22px}@media(max-width:680px){.stage{min-height:55vh}.book{width:min(94vw,440px);aspect-ratio:.664}.sheet{width:100%}.sheet.left{display:none}.sheet.right{width:100%}.book:after{display:none}.turn{left:0;width:100%}header{padding-top:14px}}
</style></head><body><header><small>GER-JYH DIGITAL PUBLICATIONS</small><h1>格致青年</h1><div class="sub">2026 APR · 格致領航，夢想啟程 · 64週年校慶</div></header><main class="stage"><div class="book" id="book"><div class="sheet left"><img id="left" alt="左頁"></div><div class="sheet right"><img id="right" alt="右頁"></div><div class="turn" id="turn"><div class="face"><img id="front"></div><div class="face back"><img id="back"></div></div></div></main><div class="controls"><button id="prev">← 上一頁</button><span class="count" id="count"></span><button id="next">下一頁 →</button><a class="btn" href="original.pdf" target="_blank">原始PDF</a></div><div class="hint">點選翻頁按鈕，或使用鍵盤左右方向鍵 · 手機可左右滑動</div><script>
const pages=['page1.jpg','page2.jpg','page3.jpg','page4.jpg'];let current=0,busy=false;const mobile=()=>matchMedia('(max-width:680px)').matches;const $=id=>document.getElementById(id);function render(){let m=mobile();$('left').src=pages[Math.max(0,current-1)];$('right').src=pages[current];$('count').textContent=`${current+1} / 4`; $('prev').disabled=current===0||busy;$('next').disabled=current===3||busy;document.querySelector('.left').style.visibility=(!m&&current>0)?'visible':'hidden'}function step(dir){if(busy||current+dir<0||current+dir>3)return;busy=true;let t=$('turn');$('front').src=pages[current];$('back').src=pages[current+dir];t.style.display='block';t.style.transition='none';t.classList.remove('go');if(dir<0){t.style.transform='rotateY(-180deg)';t.style.left=mobile()?'0':'0';}else{t.style.transform='rotateY(0deg)';t.style.left=mobile()?'0':'50%'}void t.offsetWidth;t.style.transition='transform .7s cubic-bezier(.3,.15,.2,1)';requestAnimationFrame(()=>{t.style.transform=dir>0?'rotateY(-180deg)':'rotateY(0deg)'});setTimeout(()=>{current+=dir;busy=false;t.style.display='none';render()},730)}$('next').onclick=()=>step(1);$('prev').onclick=()=>step(-1);document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')step(1);if(e.key==='ArrowLeft')step(-1)});let sx=0;document.querySelector('.book').addEventListener('touchstart',e=>sx=e.touches[0].clientX,{passive:true});document.querySelector('.book').addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>45)step(dx<0?1:-1)},{passive:true});window.addEventListener('resize',render);$('turn').style.display='none';render();
</script></body></html>
